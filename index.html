<style>
/* Имена переменных повторяют токены Cortex (Foundation, 1_3_shuffle) через дефис, как их получает разработка */
:root{
  --color-background-base-elevated:#ffffff;
  --color-background-base-primary:#ffffff;
  --color-background-base-secondary:#f1f2f3;
  --color-background-base-tertiary:#d7dbe2;
  --color-background-base-inverted:#000000;
  --color-background-base-alfa-neutral-16:#a9acb429;
  --color-background-sentiment-positive-secondary:#b3e8c9;
  --color-background-sentiment-favorite-secondary:#fff0be;
  --color-background-base-alfa-scrim:#000000cc;
  --color-content-base-primary:#141415;
  --color-content-base-secondary:#53575f;
  --color-content-base-tertiary:#6f7480;
  --color-content-base-inverted:#ffffff;
  --color-content-base-on-primary:#ffffff;
  --color-content-base-static-black:#000000;
  --color-content-brand-primary:#07244e;
  --color-content-sentiment-positive-primary:#003c19;
  --color-content-sentiment-negative-primary:#491200;
  --color-content-sentiment-favorite-primary:#56450d;
  --color-border-base-alfa-container:#b3b6bd29;
  --color-border-sentiment-positive-default:#17b95b;
  --color-solid-brand-primary-default:#0075ff;
  --color-solid-brand-primary-alfa-16:#0075ff29;
  --color-solid-brand-accent-default:#00b24b;
  --color-solid-sentiment-negative-default:#d93600;
  --rounding-container-s:12px;--rounding-container-m:16px;--rounding-container-xl:24px;--rounding-container-xxl:32px;
  --rounding-component-chipstab:999px;
  --spacing-4:4px;--spacing-6:6px;--spacing-8:8px;--spacing-12:12px;--spacing-16:16px;--spacing-20:20px;--spacing-24:24px;
  --cortexRush-panel-color-bg:rgba(255,255,255,.62);--cortexRush-field-color-bg:#ffffff;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --color-background-base-elevated:#000000;
    --color-background-base-primary:#141415;
    --color-background-base-secondary:#1d1e20;
    --color-background-base-tertiary:#2e3035;
    --color-background-base-inverted:#ffffff;
    --color-background-base-alfa-neutral-16:#b3b6bd29;
    --color-background-sentiment-positive-secondary:#002b12;
    --color-background-sentiment-favorite-secondary:#3e3209;
    --color-content-base-primary:#f0f2f5;
    --color-content-base-secondary:#9aa1b1;
    --color-content-base-tertiary:#797f8b;
    --color-content-base-inverted:#000000;
    --color-content-brand-primary:#9dd8ff;
    --color-content-sentiment-positive-primary:#9fe2bb;
    --color-content-sentiment-negative-primary:#fcb69f;
    --color-content-sentiment-favorite-primary:#ffecad;
    --color-border-base-alfa-container:#b3b6bd1f;
    --color-border-sentiment-positive-default:#00a144;
    --color-solid-sentiment-negative-default:#f63d00;
    --cortexRush-panel-color-bg:rgba(29,30,32,.55);--cortexRush-field-color-bg:#00000066;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --color-background-base-elevated:#000000;
  --color-background-base-primary:#141415;
  --color-background-base-secondary:#1d1e20;
  --color-background-base-tertiary:#2e3035;
  --color-background-base-inverted:#ffffff;
  --color-background-base-alfa-neutral-16:#b3b6bd29;
  --color-background-sentiment-positive-secondary:#002b12;
  --color-background-sentiment-favorite-secondary:#3e3209;
  --color-content-base-primary:#f0f2f5;
  --color-content-base-secondary:#9aa1b1;
  --color-content-base-tertiary:#797f8b;
  --color-content-base-inverted:#000000;
  --color-content-brand-primary:#9dd8ff;
  --color-content-sentiment-positive-primary:#9fe2bb;
  --color-content-sentiment-negative-primary:#fcb69f;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--color-background-base-elevated);color:var(--color-content-base-primary);font-family:"Inter Variable",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}

.top{position:absolute;left:var(--spacing-16);right:var(--spacing-12);top:var(--spacing-12);display:flex;align-items:center;gap:var(--spacing-8);z-index:3}
.round{flex:none;width:44px;height:44px;border-radius:var(--rounding-component-chipstab);border:0;background:var(--color-background-base-secondary);display:grid;place-items:center;padding:0;color:var(--color-content-base-primary)}
.brand{flex:1;display:flex;align-items:center;gap:var(--spacing-8);font-weight:500;font-size:20px;letter-spacing:-.02em;line-height:1}
.bal{height:44px;padding:0 var(--spacing-16) 0 var(--spacing-12);border-radius:var(--rounding-component-chipstab);background:var(--color-background-base-secondary);display:flex;align-items:center;gap:var(--spacing-8);font-size:15px;font-weight:500}
.refill{height:44px;border-radius:var(--rounding-component-chipstab);border:0;background:var(--color-background-base-inverted);color:var(--color-content-base-inverted);font-weight:600;padding:0 var(--spacing-16)}
.hist{position:absolute;left:var(--spacing-12);right:0;top:60px;display:flex;gap:var(--spacing-6);overflow-x:auto;scrollbar-width:none;z-index:3;padding-right:var(--spacing-12)}

.chip.mid span{background:var(--color-solid-brand-primary-alfa-16);color:var(--color-content-brand-primary)}
.chip.hi span{background:var(--color-background-sentiment-favorite-secondary);color:var(--color-content-sentiment-favorite-primary)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--R,120px)*1.5);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--color-content-base-primary)}
.phase{font-weight:500;font-size:13px;color:var(--color-content-base-secondary);display:flex;align-items:center;gap:var(--spacing-6)}

.phase.bad{color:var(--color-content-sentiment-negative-primary)}
.phase.bad .dot{background:var(--color-solid-sentiment-negative-default);box-shadow:0 0 10px var(--color-solid-sentiment-negative-default)}
.mult{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:calc(var(--R,120px)*.4);line-height:1;letter-spacing:-.05em;margin-top:var(--spacing-8)}
.mult.small{font-size:calc(var(--R,120px)*.32)}
.sub{font-size:13px;margin-top:var(--spacing-8);min-height:18px;color:var(--color-content-base-secondary)}

#bar{display:none!important}
.result{position:absolute;left:var(--spacing-12);right:var(--spacing-12);bottom:calc(var(--panelsH,380px) + 8px);z-index:3;padding:var(--spacing-12) var(--spacing-20);border-radius:var(--rounding-container-xxl);background:var(--cortexRush-panel-color-bg);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--color-border-base-alfa-container);display:grid;gap:var(--spacing-6);font-size:13px}
.result div{display:flex;justify-content:space-between;gap:var(--spacing-12)}
.result b{font-family:var(--font-mono);font-weight:500;white-space:nowrap}
.result .why{color:var(--color-content-base-secondary)}
.result .tot{border-top:1px solid var(--color-border-base-alfa-container);padding-top:var(--spacing-6);font-weight:600}
.toast{position:absolute;left:50%;top:112px;transform:translate(-50%,-6px);opacity:0;transition:opacity .2s,transform .2s;background:var(--color-background-base-inverted);color:var(--color-content-base-inverted);padding:var(--spacing-8) var(--spacing-16);border-radius:var(--rounding-component-chipstab);font-weight:600;font-size:13px;z-index:4;white-space:nowrap;pointer-events:none}

.ph{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-6);height:44px}
.pl{font-size:13px;font-weight:500;color:var(--color-content-base-secondary);white-space:nowrap}
.auto{display:flex;align-items:center}
.tog{height:44px;border:0;background:none;padding:0 var(--spacing-6);display:flex;align-items:center;gap:var(--spacing-6);font-size:13px;font-weight:500;color:var(--color-content-base-secondary)}
.sw{flex:none;width:32px;height:18px;border-radius:9px;background:var(--color-background-base-tertiary);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:7px;background:#fff;transition:left .15s}
.tog[aria-pressed="true"]{color:var(--color-content-base-primary)}
.tog[aria-pressed="true"] .sw{background:var(--color-solid-brand-primary-default);box-shadow:0 0 10px var(--color-solid-brand-primary-alfa-16)}
.tog[aria-pressed="true"] .sw::after{left:16px}
.sm{width:40px;height:44px;border:0;background:none;padding:0;font-size:18px;display:grid;place-items:center;color:var(--color-content-base-secondary)}
.tv{min-width:52px;text-align:center;font-family:var(--font-mono);font-size:13px}
.auto.off .sm,.auto.off .tv,.tog:disabled,.sm:disabled{opacity:.4}
.pb{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:var(--spacing-8)}
.pc{display:flex;flex-direction:column;gap:var(--spacing-6);min-width:0;transition:opacity .15s}
.pc.locked{opacity:.4}
.step{display:flex;gap:var(--spacing-4);height:44px}
.sq{flex:none;width:44px;height:44px;border-radius:var(--rounding-component-chipstab);border:0;background:var(--color-background-base-alfa-neutral-16);font-size:20px;padding:0}
.amt{flex:1;min-width:0;height:44px;border-radius:var(--rounding-component-chipstab);background:var(--cortexRush-field-color-bg);display:grid;place-items:center;font-family:var(--font-mono);font-size:16px;font-weight:500}
.pre{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--spacing-6)}
.pre button{height:44px;border-radius:var(--rounding-component-chipstab);border:0;background:var(--color-background-base-alfa-neutral-16);font-family:var(--font-mono);font-size:13px;padding:0}
.pre button[aria-pressed="true"]{background:var(--color-background-base-inverted);color:var(--color-content-base-inverted)}
.main{height:94px;border-radius:var(--rounding-component-chipstab);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 var(--spacing-8);text-align:center;transition:transform .08s,box-shadow .2s}
.main:active:not(:disabled){transform:scale(.97)}
.main .l1{font-size:16px;font-weight:600}
.main .l2{font-family:var(--font-mono);font-size:12px}
.main.bet{background:var(--color-background-base-inverted);color:var(--color-content-base-inverted)}
.main.cancel{background:var(--color-background-base-alfa-neutral-16);color:var(--color-content-base-primary)}
/* намеренно static-black на accent: белый текст на зелёном не проходит контраст */
.main.publish{background:var(--color-solid-brand-accent-default);color:var(--color-content-base-static-black);box-shadow:0 0 28px rgba(0,178,75,.45)}
.main.publish .l2{font-size:15px;font-weight:600}
.main.done{background:var(--color-background-sentiment-positive-secondary);color:var(--color-content-sentiment-positive-primary)}
.main.wait{background:var(--color-background-base-tertiary);color:var(--color-content-base-tertiary)}

#scrim{position:fixed;inset:0;background:var(--color-background-base-alfa-scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:min(100%,480px);max-height:86%;transform:translate(-50%,105%);transition:transform .25s ease;background:var(--color-background-base-secondary);color:var(--color-content-base-primary);border-radius:var(--rounding-container-xxl) var(--rounding-container-xxl) 0 0;z-index:21;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
#sheet.on{transform:translate(-50%,0);visibility:visible}
.sh{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-12);padding:var(--spacing-20) var(--spacing-12) var(--spacing-4) var(--spacing-24)}
.sh h2{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}
.sh .round{background:var(--color-background-base-tertiary)}
.sb{overflow-y:auto;padding:var(--spacing-8) var(--spacing-24) var(--spacing-24);display:flex;flex-direction:column;gap:var(--spacing-12)}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--color-border-base-alfa-container);background:none;padding:0;font-size:16px;font-weight:500;text-align:left}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:var(--spacing-12);min-height:52px;border-bottom:1px solid var(--color-border-base-alfa-container);font-size:14px}
.row b{font-family:var(--font-mono);font-weight:500;white-space:nowrap}
.mu{color:var(--color-content-base-secondary);font-size:13px}
.p{margin:0;line-height:1.5;font-size:14px}
.btn{height:52px;border-radius:var(--rounding-component-chipstab);border:0;font-weight:600;font-size:15px;padding:0 var(--spacing-16);width:100%}
.btn.p1{background:var(--color-background-base-inverted);color:var(--color-content-base-inverted)}
.btn.p3{background:var(--color-background-base-tertiary);color:var(--color-content-base-primary)}
.mini{height:44px;border-radius:var(--rounding-component-chipstab);border:0;background:var(--color-background-base-tertiary);font-weight:500;font-size:14px;padding:0 var(--spacing-16)}
code{font-family:var(--font-mono);font-size:12px;word-break:break-all;background:var(--color-background-base-elevated);border-radius:var(--rounding-container-s);padding:var(--spacing-8) var(--spacing-12);display:block;margin-top:var(--spacing-4)}
.ok{color:var(--color-content-sentiment-positive-primary);font-weight:600}
.bad{color:var(--color-content-sentiment-negative-primary);font-weight:600}

.hint{margin:0;padding:var(--spacing-12) var(--spacing-16);border-radius:var(--rounding-container-m);background:var(--color-background-base-elevated);font-size:13px;line-height:1.45;color:var(--color-content-base-secondary)}
/* на слабых устройствах и в режиме экономии стекло без размытия */
.eco .panel,.eco .result{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--color-background-base-secondary)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div id="app">
  <div id="sky">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="top">
      <button class="round" id="menuBtn" aria-label="Меню"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7h14M3 13h14"/></svg></button>
      <div class="brand"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9.5" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="11" r="3.2" fill="#0075ff"/><ellipse cx="11" cy="11" rx="10.5" ry="3.4" transform="rotate(-14 11 11)" stroke="currentColor" stroke-width="1" opacity=".55"/></svg>Cortex Rush</div>
      <button class="refill" id="refill" hidden>+1 000</button>
      <div class="bal" aria-label="Баланс в токенах"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><path d="M7 0l7 7-7 7-7-7z" fill="#0075ff"/></svg><span id="bal" class="num">10 000</span></div>
    </div>
    <div class="hist" id="hist" aria-label="Последние релизы"></div>
    <div class="center" id="center">
      <div class="phase" id="phase"><span class="dot"></span><span id="phaseT">Готовим конвейер</span></div>
      <div class="mult" id="mult" hidden></div>
      <div class="sub" id="sub"></div>
      <div id="bar" hidden><i></i></div>
    </div>
    <div class="result" id="result" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div id="panels"></div>
</div>
<div id="scrim"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh"><h2 id="shTitle"></h2><button class="round" id="shClose" aria-label="Закрыть"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
  <div class="sb" id="shBody"></div>
</section>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- Честная математика (симуляция сервера) ---------- */
const enc = new TextEncoder();
const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
const randHex = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return hex(a.buffer); };
const sha256 = async s => hex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
const hmac = async (key, msg) => {
  const k = await crypto.subtle.importKey('raw', enc.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return hex(await crypto.subtle.sign('HMAC', k, enc.encode(msg)));
};
const EDGE = 0.03, CAP = 1000, K = 0.1, BET_MS = 5000, END_MS = 3500, CHAIN = 1000;
async function crashFor(seed, client, nonce) {
  const h = await hmac(seed, client + ':' + nonce);
  const r = parseInt(h.slice(0, 13), 16) / 2 ** 52;
  return Math.min(CAP, Math.max(1, Math.floor(100 * (1 - EDGE) / (1 - r)) / 100));
}
const chain = { seeds: null, idx: 0, commitment: '', client: '' };
async function newChain() {
  chain.client = randHex(8);
  const seeds = new Array(CHAIN);
  seeds[CHAIN - 1] = randHex(32);
  for (let i = CHAIN - 2; i >= 0; i--) seeds[i] = await sha256(seeds[i + 1]);

  S.stats.net += pay - s.amount;

  if (S.settings.vibe && navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }

/* ---------- Рендер сцены: ядро компонента ---------- */
const sky = $('#sky'), cv = $('#cv'), ctx = cv.getContext('2d'), centerEl = $('#center');

    sat: '#ffffff', satText: '#141415', satLine: 'rgba(20,20,21,0.16)', dusk: ['rgba(154,202,255,0)', 'rgba(154,202,255,0.5)', 'rgba(255,214,170,0.4)'] } };
let pal = PAL.dark, dark = true;
/* цвет ядра по этапу: бренд до гейта B, акцент до гейта C, «избранное» после, негатив при детаче */
const STAGE_COL = ['#0075ff', '#00b24b', '#e6b822', '#f63d00'];
const colOf = (m, crashed) => crashed ? 3 : (stageIdx(m) < 4 ? 0 : stageIdx(m) < 7 ? 1 : 2);
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
const TOKENS = [['color', '#0075ff'], ['radius', '#00b24b'], ['spacing', '#e6b822'], ['type', '#9dd8ff']];
const FLOAT = ['spacing/16', 'rounding/container/m', 'color/solid/brand/primary/default', 'quark / modal / actions',

const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
const SP = { orbs: [], floats: [] };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  x.fillStyle = g; x.fillRect(0, 0, s, s);

    rg.addColorStop(0.62, 'rgba(255,176,122,0.42)'); rg.addColorStop(0.82, hexA(col, 0.14)); rg.addColorStop(1, hexA(col, 0));

    rg.addColorStop(0, hexA(col, 0.55)); rg.addColorStop(0.45, hexA(col, 0.22)); rg.addColorStop(1, hexA(col, 0));

function resize() {
  const rect = sky.getBoundingClientRect();
  W = rect.width; H = rect.height;
  DPR = Math.min(window.devicePixelRatio || 1, S.settings.eco ? 1 : 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  dark = isDark(); pal = dark ? PAL.dark : PAL.light;
  FLOOR = H - $('#panels').offsetHeight;
  sky.style.setProperty('--panelsH', (H - FLOOR) + 'px');
  const topY = 108, botY = FLOOR - 36;
  R = Math.max(70, Math.min(W * 0.31, (botY - topY) / 2 - 20));
  CX = W / 2; CY = topY + (botY - topY) / 2;
  SP.orbs = STAGE_COL.map(c => makeOrb(R, c));
  const Rr = rng(7);
  SP.floats = FLOAT.map(l => ({ l, x: Rr() * W, y: Rr() * (H + 200), par: 0.3 + 0.7 * Rr(), drift: (Rr() - 0.5) * 6 }));
  centerEl.style.left = CX + 'px'; centerEl.style.top = CY + 'px'; centerEl.style.setProperty('--R', R + 'px');
}
let rzT = 0;
const onRz = () => { clearTimeout(rzT); rzT = setTimeout(resize, 80); };
if (window.ResizeObserver) { const ro = new ResizeObserver(onRz); ro.observe(sky); ro.observe($('#panels')); } else window.addEventListener('resize', onRz);
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', resize);
new MutationObserver(resize).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const orb = { dy: 0, a: 1, ct: 0, ci: 0, prev: 0, cf: 1 };
function kiteCrash() { orb.ct = now(); }
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let Acur = 0;

  ctx.arc(x, y, R + 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); ctx.stroke();
}
function drawSat(s, a) {

  const w = ctx.measureText(s.tk[0]).width + 26, h = 22;
  rr(s.x - w / 2, s.y - h / 2, w, h, 11); ctx.fillStyle = pal.sat; ctx.fill(); ctx.strokeStyle = pal.satLine; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = s.tk[1]; ctx.beginPath(); ctx.arc(s.x - w / 2 + 10, s.y, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = pal.satText; ctx.fillText(s.tk[0], s.x - w / 2 + 17, s.y + 0.5);
}
function render(t, dt) {
  if (!W || !SP.orbs.length) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ph = S.phase, crashed = ph === 'crashed', flying = ph === 'flight' || crashed;
  const At = flying ? 260 * Math.log(S.m) : 0;
  if (ph === 'flight') Acur = At; else if (!crashed) Acur += (At - Acur) * Math.min(1, dt * 2.5);
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, W, H);
  const dg = ctx.createLinearGradient(0, H * 0.4, 0, H);
  dg.addColorStop(0, pal.dusk[0]); dg.addColorStop(0.7, pal.dusk[1]); dg.addColorStop(1, pal.dusk[2]);
  ctx.fillStyle = dg; ctx.fillRect(0, H * 0.4, W, H * 0.6);

    for (let y = off - step; y < H; y += step) for (let x = 11; x < W; x += step) ctx.fillRect(x, y, 1.2, 1.2);
  }
  /* токены и слои Cortex дрейфуют фоном и уезжают вниз при подъёме */
  ctx.font = '400 10px ' + MONO; ctx.textBaseline = 'middle'; ctx.fillStyle = pal.label;
  const span = H + 200;

    ctx.fillStyle = pal.strataText; ctx.fillText(n, 14, y + bh / 2);

  const ox = CX, oy = CY + orb.dy + bob;
  const ti = colOf(S.m, crashed);

  orb.cf = Math.min(1, orb.cf + dt * 2.5);
  const col = STAGE_COL[orb.ci];

/* ---------- Цикл ---------- */
let lastTs = 0, frameN = 0, dtAvg = 0.016, slow = false, lastEco = null;
function frame(ts) {
  requestAnimationFrame(frame);
  tick();
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
  lastTs = ts; frameN++;
  dtAvg = dtAvg * 0.95 + dt * 0.05;
  if (!slow && frameN > 120 && dtAvg > 0.024) slow = true;
  const eco = !!(S.settings.eco || slow);
  if (eco !== lastEco) { document.body.classList.toggle('eco', eco); lastEco = eco; }
  perFrameUI();
  if ((S.settings.eco || slow) && frameN % 2) return;
  render(ts / 1000, (S.settings.eco || slow) ? dt * 2 : dt);
}
setInterval(tick, 100);
resize(); ui();
requestAnimationFrame(frame);
newChain().then(startBetting).catch(err => { console.error(err); el.phaseT.textContent = 'Не получилось запустить'; el.sub.hidden = false; el.sub.textContent = 'Открой страницу в современном браузере по HTTPS'; });

/* PWA: офлайн-кэш и установка на экран «Домой» (работает только по http/https) */

  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW:', err)));
}
})();
